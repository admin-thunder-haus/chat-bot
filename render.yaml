# Render Blueprint for the AI customer support backend.
# Docs: https://render.com/docs/blueprint-spec
#
# This deploys the BACKEND (Express API) as a Node web service from the monorepo
# root. The frontend is NOT deployed here (run it locally, or add a second
# service later). Secrets are marked `sync: false` — set them in the Render
# dashboard by pasting apps/backend/.env.render (Environment → "Add from .env").
services:
  - type: web
    name: ai-support-backend
    runtime: node
    plan: free
    rootDir: .
    # Install ALL deps (prisma CLI + tsc are devDependencies), generate the
    # Prisma client, apply pending migrations (uses DIRECT_URL), then compile.
    # Migrations run in the build step because Render's free tier does not
    # support preDeployCommand.
    buildCommand: npm ci --include=dev && npm run prisma:generate -w apps/backend && npm run prisma:migrate -w apps/backend && npm run build -w apps/backend
    startCommand: npm run start -w apps/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns the port; the app reads BACKEND_PORT. Render's default is 10000.
      - key: BACKEND_PORT
        value: 10000
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      # The deployed dashboard's origin. Matched EXACTLY (scheme + host, no
      # trailing slash) and a miss throws rather than silently omitting the
      # header, so a typo here surfaces as a 500 on every browser request.
      # Comma-separated; localhost stays so local development keeps working.
      #
      # Blueprint-managed values are read-only in the Render dashboard — this
      # line is the only place it can be changed.
      - key: CORS_ORIGINS
        value: https://app.thunder-haus.com,http://localhost:3000
      # Where OAuth callbacks send the browser once a channel is connected.
      # Kept here beside CORS_ORIGINS because the two must name the same host:
      # setting only one yields a dashboard that either cannot call the API or
      # strands anyone who finishes a Meta connect.
      - key: FRONTEND_APP_URL
        value: https://app.thunder-haus.com
      # --- secrets: set these in the dashboard from apps/backend/.env.render ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHANNEL_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # Platform verify token for the SHARED Meta webhook endpoints. Set it here
      # and paste the same value into the Meta app's Webhooks product.
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WIDGET_SESSION_SECRET
        sync: false
      # Error tracking. OPTIONAL: leave it unset and the SDK is never loaded —
      # the app behaves exactly as it does today, just without reporting.
      - key: SENTRY_DSN
        sync: false
      # Object storage for uploaded files (images, voice notes, knowledge PDFs).
      # OPTIONAL — while ANY of these is unset the bytes stay in Postgres, which
      # is the current, working behaviour. Set all five (plus S3_REGION below) to
      # move new uploads to Cloudflare R2 / AWS S3, then run
      # `npx tsx scripts/migrate-storage-to-s3.ts` once to move the existing rows.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # --- non-secret app config ---
      - key: AI_FEATURE_ENABLED
        value: "true"
      # Platform-wide kill switch only — each company opts in with its own
      # "Auto-reply" toggle (off by default). Set to "false" to stop AI
      # auto-replies for every company at once.
      - key: AI_AUTO_REPLY_ENABLED
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FAKE_CHANNEL_ENABLED
        value: "false"
      # In-process retry sweeper. Required here: the free instance sleeps and
      # restarts, and without a sweep every delivery waiting on its backoff
      # would be dropped silently instead of being re-attempted.
      - key: CHANNEL_RETRY_SWEEP_ENABLED
        value: "true"
      - key: CHANNEL_RETRY_SWEEP_MS
        value: "60000"
      # Billing & subscriptions are OFF: customers are invoiced offline (bank
      # transfer / cash). While off, nothing is limited, no subscription rows
      # are written, /api/v1/billing/* answers 410, and the dashboard hides the
      # Billing page. Flip this ONE value to "true" to start selling plans.
      - key: BILLING_ENABLED
        value: "false"
      # SigV4 region for the bucket above. Cloudflare R2 requires the literal
      # "auto"; for AWS S3 change this to the bucket's real region. Not a secret,
      # so it is checked in rather than set in the dashboard.
      - key: S3_REGION
        value: auto
      # Login audit trail retention. Pruning rides along on login writes (no
      # extra timer), which matters on an instance that sleeps and restarts.
      - key: LOGIN_AUDIT_RETENTION_DAYS
        value: "90"
      - key: LOGIN_AUDIT_PRUNE_ENABLED
        value: "true"
      # Sentry environment label (defaults to NODE_ENV when unset). Tracing is
      # deliberately 0: errors are reported, requests are never wrapped.
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      # Blanks in the public /privacy and /terms TEMPLATE. Until each is set the
      # page renders a visible "[ FILL IN: … ]" placeholder and a banner — so an
      # unfinished policy cannot be mistaken for a finished one. Meta app review
      # and EU customers read these pages; fill all five before launch.
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: LEGAL_ENTITY_ADDRESS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_DATA_RETENTION
        sync: false
      - key: LEGAL_JURISDICTION
        sync: false
